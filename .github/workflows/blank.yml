name: Build LifeTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p lifetrack-source
          unzip -o lifetrack.zip -d lifetrack-source

      - name: Find Gradle Project
        run: |
          WRAPPER=$(find lifetrack-source -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-APK
          path: lifetrack-source/**/build/outputs/apk/debug/*.apk
